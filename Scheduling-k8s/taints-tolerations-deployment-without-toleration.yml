apiVersion: apps/v1                
kind:  Deployment                  
metadata:                          
    name: taint-tolerations-deployment          
spec:                                
    replicas: 3                        
    selector:                  
        matchLabels:            
            app: nginx_label    
    template:                   
        metadata:               
            labels:
                app: nginx_label
        spec:               
            containers:
            - name: nginx-container    
              image: nginx:latest
              ports:
              - containerPort: 80