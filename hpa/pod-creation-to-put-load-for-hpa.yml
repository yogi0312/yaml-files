apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-load-check-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: put-load-on-cpu
  template:
    metadata:
      labels:
        app: put-load-on-cpu
    spec:
      containers:
      - name: load-php-application
        image: busybox
        command:
        - /bin/sh
        - -c
        - "while true; do wget -q http://php-app-ci; done"